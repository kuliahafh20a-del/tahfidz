name: yaqin

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yaqin}
      POSTGRES_USER: ${POSTGRES_USER:-yaqin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  object-storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-change-me}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change-me-local-only}
    volumes:
      - object_storage_data:/data
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${OBJECT_STORAGE_CONSOLE_PORT:-9001}:9001"
    networks:
      - edge
      - backend

  object-storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until /usr/bin/mc alias set local http://object-storage:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        /usr/bin/mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}";
        /usr/bin/mc anonymous set none "local/$${OBJECT_STORAGE_BUCKET}";
        /usr/bin/mc cors set "local/$${OBJECT_STORAGE_BUCKET}" /config/cors.xml
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-change-me}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-change-me-local-only}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-yaqin-private}
    volumes:
      - ./infra/minio/cors.xml:/config/cors.xml:ro
    networks:
      - backend
    depends_on:
      object-storage:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: development
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yaqin}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-yaqin}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: ${DATABASE_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Jakarta}
      SESSION_SECRET: ${SESSION_SECRET:-development-session-secret-change-me-32}
      CSRF_SECRET: ${CSRF_SECRET:-development-csrf-secret-change-me-32chars}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      RECOVERY_TOKEN_TTL_SECONDS: ${RECOVERY_TOKEN_TTL_SECONDS:-1800}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-900}
      RECOVERY_RATE_LIMIT_ATTEMPTS: ${RECOVERY_RATE_LIMIT_ATTEMPTS:-3}
      RECOVERY_RATE_LIMIT_WINDOW_SECONDS: ${RECOVERY_RATE_LIMIT_WINDOW_SECONDS:-3600}
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:${OBJECT_STORAGE_PORT:-9000}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-yaqin-private}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-change-me}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change-me-local-only}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}
      AUDIO_ALLOWED_CONTENT_TYPES: ${AUDIO_ALLOWED_CONTENT_TYPES:-audio/mp4,audio/mpeg,audio/ogg,audio/webm}
      AUDIO_MAX_SIZE_BYTES: ${AUDIO_MAX_SIZE_BYTES:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - edge
      - backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      object-storage-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.worker.main"]
    environment:
      APP_ENV: development
      APP_VERSION: ${APP_VERSION:-0.1.0}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yaqin}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-yaqin}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-15000}
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: ${DATABASE_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:${OBJECT_STORAGE_PORT:-9000}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-yaqin-private}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-change-me}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-change-me-local-only}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-300}
      AUDIO_ALLOWED_CONTENT_TYPES: ${AUDIO_ALLOWED_CONTENT_TYPES:-audio/mp4,audio/mpeg,audio/ogg,audio/webm}
      AUDIO_MAX_SIZE_BYTES: ${AUDIO_MAX_SIZE_BYTES:-10485760}
      MEDIA_WORKER_POLL_SECONDS: ${MEDIA_WORKER_POLL_SECONDS:-2}
      MEDIA_VALIDATION_MAX_ATTEMPTS: ${MEDIA_VALIDATION_MAX_ATTEMPTS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
        restart: true
      object-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    init: true
    environment:
      INTERNAL_API_BASE_URL: http://api:8000/api/v1
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-YAQin}
      NEXT_PUBLIC_BASE_URL: http://localhost:${WEB_PORT:-3000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  object_storage_data:

