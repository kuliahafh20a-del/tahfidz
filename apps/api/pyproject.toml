[project]
name = "yaqin-api"
version = "0.1.0"
description = "FastAPI backend for the YAQin Juz 30 mentoring application"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.17,<2",
  "argon2-cffi>=25.1,<26",
  "fastapi[standard]>=0.150.0,<0.151.0",
  "httpx>=0.28.1,<0.29",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tzdata>=2026.1",
]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pip-audit>=2.10.1",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "migration: PostgreSQL migration smoke and rollback tests",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true

